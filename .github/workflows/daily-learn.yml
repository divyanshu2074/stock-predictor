name: Daily Learn & Predict

# The heart of the self-improving loop. Runs after every US market close:
# grades yesterday's forecast -> ingests new data -> fine-tunes -> predicts next day
# -> commits all AI state back to this repo -> Pages auto-redeploys.

on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC = 17:30 ET, Mon-Fri (after close)
  workflow_dispatch: {}        # manual trigger anytime

permissions:
  contents: write              # commit model/data artifacts back to the repo
  pages: write                 # not strictly needed (push-based Pages), kept for safety

concurrency:
  group: daily-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install yfinance

      - name: Discover tracked symbols
        id: syms
        run: |
          SYMS=$(ls ai/*_prediction.json 2>/dev/null | xargs -r -n1 basename | sed 's/_prediction.json//' | tr '\n' ' ')
          if [ -z "$SYMS" ]; then SYMS="AAPL"; fi
          echo "list=$SYMS" >> "$GITHUB_OUTPUT"
          echo "Tracking: $SYMS"

      - name: Run self-learning daily cycle
        env:
          FULL_BACKTEST: ${{ vars.FULL_BACKTEST == 'true' && '1' || '0' }}
        run: python scripts/daily_cycle.py ${{ steps.syms.outputs.list }}

      - name: Commit AI state + website data
        run: |
          git config user.name "stockpred-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ai/ web/data.js
          if git diff --cached --quiet; then
            echo "No changes."; 
          else
            git commit -m "daily cycle $(date -u +%F): learn from deviation, re-predict [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## 📈 StockPRED daily cycle"
            for f in ai/*_prediction.json; do
              [ -e "$f" ] || continue
              sym=$(basename "$f" _prediction.json)
              echo "### $sym"
              python3 -c "
          import json;d=json.load(open('$f'))
          print(f\"- as of **{d['as_of_date']}** close \\${d['as_of_close']}\")
          print(f\"- next-day call: **{d['direction']}** ({100*d['predicted_return']:+.2f}%) → target \\${d['predicted_close']} by {d.get('target_date','next session')}\")
          print(f\"- band: \\${d['confidence_band'][0]} – \\${d['confidence_band'][1]}\")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
